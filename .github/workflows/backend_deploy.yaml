name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          
          # 智能处理 wrangler.toml 并强制加上 nodejs_compat 兼容标志
          if [ -n "$WRANGLER_TOML_CONTENT" ]; then
            printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          elif [ -f wrangler.toml.example ]; then
            cp wrangler.toml.example wrangler.toml
            echo "Using wrangler.toml.example"
          fi
          
          # 确保 wrangler.toml 存在并且包含 nodejs_compat 标志
          if [ ! -f wrangler.toml ]; then
            echo 'name = "grok-mail-api"' > wrangler.toml
            echo 'main = "src/index.ts"' >> wrangler.toml
            echo 'compatibility_date = "2024-03-20"' >> wrangler.toml
          fi
          
          # 检查并追加 nodejs_compat 标志
          if ! grep -q "nodejs_compat" wrangler.toml; then
            echo 'compatibility_flags = ["nodejs_compat"]' >> wrangler.toml
          fi
          
          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          pnpm wrangler deploy --autoconfig=false
          
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
